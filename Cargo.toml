[package]
name = "ifcx-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Spatial and material relationship extraction for IFC, complementing ifclite-geom"
keywords = ["ifc", "bim", "spatial", "materials", "python"]
categories = ["parsing", "science"]

[lib]
name = "ifcx_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:pythonize"]

[dependencies]
ifc-lite-core = "7.1.1"
pyo3 = { version = "0.29", optional = true, features = ["abi3-py39"] }
pythonize = { version = "0.29", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
