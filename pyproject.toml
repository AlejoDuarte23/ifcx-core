[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "ifcx-core"
version = "0.1.0"
description = "Native IFC spatial and material relationships for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
authors = [{ name = "IFCX Contributors" }]
keywords = ["ifc", "bim", "spatial", "materials", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ifcopenshell==0.8.5; python_version >= '3.10' and python_version < '3.15'",
]

[project.urls]
Upstream = "https://github.com/LTplus-AG/ifc-lite"

[dependency-groups]
dev = [
  "ifcopenshell==0.8.5; python_version >= '3.10' and python_version < '3.15'",
  "maturin>=1.9,<2.0",
  "pytest>=8,<10",
]

[tool.maturin]
module-name = "ifcx_core"
features = ["python", "pyo3/extension-module"]
include = [
  { path = "ifcx_core.pyi", format = "wheel" },
  { path = "LICENSE", format = "wheel" },
  { path = "ACKNOWLEDGEMENTS.md", format = "wheel" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring an external IFC model and IfcOpenShell"]
